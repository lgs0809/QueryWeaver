name: ${QUERYWEAVER_COMPOSE_PROJECT_NAME:-queryweaver}

services:
  metadata-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${QUERYWEAVER_METADATA_DATABASE:-queryweaver}
      POSTGRES_USER: ${QUERYWEAVER_METADATA_USER:-queryweaver}
      POSTGRES_PASSWORD: ${QUERYWEAVER_METADATA_PASSWORD:?set QUERYWEAVER_METADATA_PASSWORD}
    volumes:
      - queryweaver-metadata:/var/lib/postgresql/data
    networks: [queryweaver-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/Dockerfile-backend
    image: ${QUERYWEAVER_BACKEND_IMAGE:-queryweaver/backend:local}
    environment:
      SPRING_PROFILES_ACTIVE: ${QUERYWEAVER_SPRING_PROFILE:-standalone}
      QUERYWEAVER_DATASOURCE_URL: jdbc:postgresql://metadata-db:5432/${QUERYWEAVER_METADATA_DATABASE:-queryweaver}?stringtype=unspecified
      QUERYWEAVER_DATASOURCE_USERNAME: ${QUERYWEAVER_METADATA_USER:-queryweaver}
      QUERYWEAVER_DATASOURCE_PASSWORD: ${QUERYWEAVER_METADATA_PASSWORD}
      QUERYWEAVER_DATASOURCE_DRIVER: org.postgresql.Driver
      QUERYWEAVER_CODE_EXECUTOR: remote
      QUERYWEAVER_EXECUTION_REMOTE_URL: http://execution-worker:8066
      QUERYWEAVER_EXECUTION_INTERNAL_TOKEN: ${QUERYWEAVER_EXECUTION_INTERNAL_TOKEN:?set QUERYWEAVER_EXECUTION_INTERNAL_TOKEN}
      QUERYWEAVER_OPERATOR_DEVELOPMENT_MODE: ${QUERYWEAVER_OPERATOR_DEVELOPMENT_MODE:-false}
      QUERYWEAVER_SECURITY_ENABLED: ${QUERYWEAVER_SECURITY_ENABLED:-false}
      QUERYWEAVER_JWT_ISSUER_URI: ${QUERYWEAVER_JWT_ISSUER_URI:-}
      QUERYWEAVER_SECRET_ENCRYPTION_KEY: ${QUERYWEAVER_SECRET_ENCRYPTION_KEY:?set QUERYWEAVER_SECRET_ENCRYPTION_KEY}
      QUERYWEAVER_RETENTION_ENABLED: ${QUERYWEAVER_RETENTION_ENABLED:-true}
      QUERYWEAVER_RETENTION_DRY_RUN: ${QUERYWEAVER_RETENTION_DRY_RUN:-true}
      QUERYWEAVER_RETENTION_TERMINAL_RUN_DAYS: ${QUERYWEAVER_RETENTION_TERMINAL_RUN_DAYS:-90}
      QUERYWEAVER_RETENTION_BATCH_SIZE: ${QUERYWEAVER_RETENTION_BATCH_SIZE:-100}
      QUERYWEAVER_RETENTION_BATCH_AUDIT_DAYS: ${QUERYWEAVER_RETENTION_BATCH_AUDIT_DAYS:-365}
      QUERYWEAVER_RETENTION_SCAN_DELAY_MS: ${QUERYWEAVER_RETENTION_SCAN_DELAY_MS:-3600000}
      QUERYWEAVER_RETENTION_LEASE_DURATION_SECONDS: ${QUERYWEAVER_RETENTION_LEASE_DURATION_SECONDS:-600}
      QUERYWEAVER_PLANNER_REASONING_ENABLED: ${QUERYWEAVER_PLANNER_REASONING_ENABLED:-true}
      QUERYWEAVER_PLANNER_REASONING_EFFORT: ${QUERYWEAVER_PLANNER_REASONING_EFFORT:-medium}
      QUERYWEAVER_PLANNER_REASONING_MODEL_OVERRIDE: ${QUERYWEAVER_PLANNER_REASONING_MODEL_OVERRIDE:-}
      QUERYWEAVER_POST_EXECUTION_REVIEW_SEMANTIC_ENABLED: ${QUERYWEAVER_POST_EXECUTION_REVIEW_SEMANTIC_ENABLED:-true}
      QUERYWEAVER_MCP_ENABLED: ${QUERYWEAVER_MCP_ENABLED:-true}
      QUERYWEAVER_MCP_PUBLIC_BASE_URL: ${QUERYWEAVER_MCP_PUBLIC_BASE_URL:-http://127.0.0.1:${QUERYWEAVER_BACKEND_PORT:-28065}}
      QUERYWEAVER_MCP_ENDPOINT: ${QUERYWEAVER_MCP_ENDPOINT:-/mcp}
    ports:
      - "${QUERYWEAVER_BACKEND_PORT:-28065}:8065"
    volumes:
      - queryweaver-uploads:/app/uploads
    depends_on:
      metadata-db:
        condition: service_healthy
      execution-worker:
        condition: service_healthy
    networks: [queryweaver-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8065/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  execution-worker:
    profiles: [app, worker]
    build:
      context: ../..
      dockerfile: deploy/Dockerfile-backend
    image: ${QUERYWEAVER_BACKEND_IMAGE:-queryweaver/backend:local}
    user: "0:0"
    environment:
      QUERYWEAVER_RUNTIME_ROLE: execution-worker
      QUERYWEAVER_EXECUTION_INTERNAL_TOKEN: ${QUERYWEAVER_EXECUTION_INTERNAL_TOKEN:?set QUERYWEAVER_EXECUTION_INTERNAL_TOKEN}
      QUERYWEAVER_EXECUTION_IMAGE: ${QUERYWEAVER_EXECUTION_IMAGE:-continuumio/anaconda3:latest}
      QUERYWEAVER_EXECUTION_NETWORK_MODE: none
      QUERYWEAVER_EXECUTION_READ_ONLY_ROOT: "true"
      QUERYWEAVER_EXECUTION_RUN_AS_USER: ${QUERYWEAVER_EXECUTION_RUN_AS_USER:-65534:65534}
      QUERYWEAVER_EXECUTION_PIDS_LIMIT: ${QUERYWEAVER_EXECUTION_PIDS_LIMIT:-64}
      SERVER_PORT: 8066
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8066/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks: [queryweaver-net]
    restart: unless-stopped

  frontend:
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/Dockerfile-frontend
    image: ${QUERYWEAVER_FRONTEND_IMAGE:-queryweaver/frontend:local}
    ports:
      - "${QUERYWEAVER_FRONTEND_PORT:-23000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [queryweaver-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/queryweaver/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  demo-mysql:
    profiles: [demo]
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: ${QUERYWEAVER_DEMO_MYSQL_ROOT_PASSWORD:-}
      QUERYWEAVER_DEMO_MYSQL_READER_PASSWORD: ${QUERYWEAVER_DEMO_MYSQL_READER_PASSWORD:-}
    ports:
      - "${QUERYWEAVER_DEMO_MYSQL_PORT:-33307}:3306"
    volumes:
      - ../config/mysql/product_db.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
      - ./mysql/20-readonly-user.sh:/docker-entrypoint-initdb.d/20-readonly-user.sh:ro
      - queryweaver-demo-mysql:/var/lib/mysql
    networks: [queryweaver-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  demo-postgres:
    profiles: [demo]
    image: postgres:15
    environment:
      POSTGRES_USER: ${QUERYWEAVER_DEMO_POSTGRES_ADMIN:-queryweaver_admin}
      POSTGRES_PASSWORD: ${QUERYWEAVER_DEMO_POSTGRES_ADMIN_PASSWORD:-}
      QUERYWEAVER_DEMO_POSTGRES_READER_PASSWORD: ${QUERYWEAVER_DEMO_POSTGRES_READER_PASSWORD:-}
    ports:
      - "${QUERYWEAVER_DEMO_POSTGRES_PORT:-35432}:5432"
    volumes:
      - ../config/postgres/china_population_db.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
      - ./postgres/20-readonly-user.sh:/docker-entrypoint-initdb.d/20-readonly-user.sh:ro
      - queryweaver-demo-postgres:/var/lib/postgresql/data
    networks: [queryweaver-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  queryweaver-metadata:
    name: ${QUERYWEAVER_METADATA_VOLUME:-queryweaver-metadata-pg16}
  queryweaver-uploads:
    name: ${QUERYWEAVER_UPLOADS_VOLUME:-queryweaver-uploads}
  queryweaver-demo-mysql:
    name: ${QUERYWEAVER_DEMO_MYSQL_VOLUME:-queryweaver-demo-mysql}
  queryweaver-demo-postgres:
    name: ${QUERYWEAVER_DEMO_POSTGRES_VOLUME:-queryweaver-demo-postgres}

networks:
  queryweaver-net:
    name: ${QUERYWEAVER_NETWORK_NAME:-queryweaver-net}
    driver: bridge
