server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8065;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        proxy_pass http://backend:8065;
        proxy_set_header Host $host;
    }

    # QueryWeaver v1 web-path compatibility. New documentation and generated links use /semevosql/.
    location = /queryweaver {
        return 308 /semevosql/$is_args$args;
    }

    location ~ ^/queryweaver/(.*)$ {
        return 308 /semevosql/$1$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
