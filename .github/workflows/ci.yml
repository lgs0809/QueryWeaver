name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Release hygiene
        run: ./scripts/check-release-hygiene.sh
      - name: Backend verify
        run: ./mvnw -s .github/maven-settings.xml -pl backend -am verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run unused
      - run: npm run build
      - run: npm audit --audit-level=high

  docker-release-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      QUERYWEAVER_COMPOSE_PROJECT_NAME: queryweaver-ci-${{ github.run_id }}
      QUERYWEAVER_METADATA_VOLUME: queryweaver-ci-${{ github.run_id }}-metadata
      QUERYWEAVER_UPLOADS_VOLUME: queryweaver-ci-${{ github.run_id }}-uploads
      QUERYWEAVER_NETWORK_NAME: queryweaver-ci-${{ github.run_id }}-network
      QUERYWEAVER_BACKEND_PORT: '28065'
      QUERYWEAVER_FRONTEND_PORT: '23000'
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral deployment environment
        run: ./scripts/init-deployment-env.sh
      - name: Validate Compose
        run: >-
          docker compose
          --env-file deploy/queryweaver/.env
          -f deploy/queryweaver/docker-compose.yml
          --profile app config --quiet
      - name: Build and start portable deployment
        env:
          QUERYWEAVER_BUILD: 'true'
          QUERYWEAVER_STARTUP_TIMEOUT: '240'
        run: ./scripts/start-queryweaver.sh
      - name: Verify backend and frontend
        run: |
          curl -fsS http://127.0.0.1:28065/actuator/health
          curl -fsS http://127.0.0.1:23000/queryweaver/ >/dev/null
      - name: Show container logs on failure
        if: failure()
        run: >-
          docker compose
          --env-file deploy/queryweaver/.env
          -f deploy/queryweaver/docker-compose.yml
          --profile app logs --no-color --tail=200
      - name: Stop deployment
        if: always()
        run: >-
          docker compose
          --env-file deploy/queryweaver/.env
          -f deploy/queryweaver/docker-compose.yml
          --profile app down -v --remove-orphans
