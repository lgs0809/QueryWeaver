spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SEMEVOSQL_JWT_ISSUER_URI}

semevosql:
  code-executor:
    code-pool-executor: ${SEMEVOSQL_CODE_EXECUTOR:docker}
  sql-execution:
    require-time-filter: true
    reject-full-table-scan: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

semevosql:
  mcp:
    enabled: ${SEMEVOSQL_MCP_ENABLED:true}
  security:
    enabled: true
  operator:
    development-mode: false

logging:
  level:
    root: info
    cn.lgs.semevosql: info
    org.springframework.jdbc: warn
